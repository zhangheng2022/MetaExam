name: 项目检查
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 准备锁定工具链
        shell: powershell
        run: ./tools/bootstrap.ps1
      - name: CI 保护规则回归
        shell: powershell
        run: ./tools/run.ps1 test:ci
      - name: 构建应用与共享包
        shell: powershell
        run: ./tools/run.ps1 build
      - name: TypeScript 类型检查
        shell: powershell
        run: ./tools/run.ps1 typecheck
      - name: ESLint 零警告检查
        shell: powershell
        run: ./tools/run.ps1 exec eslint . --max-warnings 0
      - name: Prettier 格式检查
        shell: powershell
        run: ./tools/run.ps1 format:check
      - name: 单元测试
        shell: powershell
        run: ./tools/run.ps1 test
