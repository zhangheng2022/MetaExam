name: 锁定工具链与依赖
description: 缓存锁定工具下载包，校验工具链并执行冻结依赖安装
inputs:
  packaging:
    description: 是否准备安装包工具
    default: 'false'
runs:
  using: composite
  steps:
    - name: 恢复下载缓存
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          .tools/node-official.zip
          .tools/postgres.zip
          .tools/innosetup.exe
          .tools/WinSW.NET462.exe
          .tools/vc_redist.x64.exe
        key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.packaging }}-${{ hashFiles('toolchain.lock.json') }}
    - name: 校验工具链并安装依赖
      shell: powershell
      env:
        PREPARE_PACKAGING: ${{ inputs.packaging }}
      run: |
        if ($env:PREPARE_PACKAGING -notin @('true','false')) { throw 'PACKAGING_INPUT_INVALID' }
        ./tools/bootstrap.ps1 -Packaging:($env:PREPARE_PACKAGING -eq 'true') -SkipDatabase:($env:PREPARE_PACKAGING -eq 'false')
